plugins {
    id("org.jetbrains.intellij.platform") version "2.2.1"
    id 'java'
}

group 'com.intellijwindowtabs'
version System.getenv("RELEASE_VERSION") ?: '0.1.0'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        intellijIdeaCommunity '2024.3.2.1'
        bundledPlugin 'com.intellij.tasks'
        bundledPlugin 'Git4Idea'
    }
}

patchPluginXml {
    version = project.getVersion()
    untilBuild = provider { null }
    changeNotes = project.file("marketplace-changenotes.html").text
    pluginDescription = project.file("marketplace-description.html").text
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

signPlugin {
    certificateChain = System.getenv("CERTIFICATE_CHAIN")
    privateKey = System.getenv("PRIVATE_KEY")
    password = System.getenv("PRIVATE_KEY_PASSWORD")
}

publishPlugin {
    token = System.getenv("PUBLISH_TOKEN")
}
