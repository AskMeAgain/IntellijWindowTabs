plugins {
    id("org.jetbrains.intellij.platform") version "2.14.0"
    id 'java'
}

group 'projecttabbar'
version System.getenv("RELEASE_VERSION") ?: '0.1.0'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
    intellijPlatform {
        def localIdePath = providers.gradleProperty('localIdePath').orNull
        if (localIdePath) {
            local(localIdePath)
        } else {
            intellijIdea '2026.1'
        }
        bundledPlugin 'Git4Idea'
        bundledModule 'intellij.platform.vcs.dvcs'
        bundledModule 'intellij.platform.vcs.dvcs.impl'
    }
}

intellijPlatform {
    instrumentCode = false
}

patchPluginXml {
    version = project.getVersion()
    sinceBuild = '261'
    untilBuild = provider { null }
    changeNotes = project.file("marketplace-changenotes.html").text
    pluginDescription = project.file("marketplace-description.html").text
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

signPlugin {
    certificateChain = System.getenv("CERTIFICATE_CHAIN")
    privateKey = System.getenv("PRIVATE_KEY")
    password = System.getenv("PRIVATE_KEY_PASSWORD")
}

publishPlugin {
    token = System.getenv("PUBLISH_TOKEN")
}
